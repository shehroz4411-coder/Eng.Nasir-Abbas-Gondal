<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shehroz 44 11 Portfolio</title>
<meta name="description" content="Shehroz 44 11 (S4411) — premium website concepts for real estate, restaurants, cafes, salons, clinics, e-commerce, hotels, gyms and corporate businesses.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300..800&family=Archivo:ital,wght@0,400..900;1,700..900&family=Syne:wght@500..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&family=Anton&family=Italiana&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=DM+Serif+Display:ital@0;1&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Big+Shoulders+Display:wght@600..900&family=Instrument+Serif:ital@0;1&family=Marcellus&display=swap">
<style>
/* Layout concept: a dark studio gallery — each industry is a room, each concept a live miniature site floating in a browser frame. */
:root {
  --ink: #07080b; --ink-2: #0c0e13; --ink-3: #12151c; --ink-4: #191d26;
  --fg: #eef1f7; --mut: #8d95a7; --dim: #5d6577;
  --line: rgba(214, 224, 255, .085); --line-2: rgba(214, 224, 255, .16);
  --blue: #4f7cff; --blue-2: #a3bbff; --gold: #cfae72;
  --fd: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --fb: 'Geist', 'Helvetica Neue', Arial, sans-serif;
  --fm: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --hh: 108px;
  color-scheme: dark;
}
html { background: var(--ink); scroll-behavior: smooth; }
body { background: var(--ink); color: var(--fg); font-family: var(--fb); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; margin: 0; }
#app { overflow-x: clip; min-height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
a { color: inherit; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 3px; }
.wrap { max-width: 1320px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 48px); }
.lbl { font: 500 11.5px/1 var(--fm); letter-spacing: .16em; text-transform: uppercase; color: var(--mut); display: inline-flex; align-items: center; gap: 10px; }
.lbl::before { content: ""; width: 6px; height: 6px; background: var(--blue); border-radius: 1px; box-shadow: 0 0 12px var(--blue); }
.lbl.gold::before { background: var(--gold); box-shadow: 0 0 12px var(--gold); }
.h-xl, .h-l, .h-m { font-family: var(--fd); font-weight: 650; letter-spacing: -0.04em; line-height: .98; margin: 0; text-wrap: balance; }
.h-xl { font-size: clamp(44px, 6.4vw, 96px); }
.h-l { font-size: clamp(34px, 4.6vw, 64px); }
.h-m { font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.03em; line-height: 1.08; }
.mut { color: var(--mut); }
.p-l { font-size: clamp(16px, 1.3vw, 19px); color: var(--mut); max-width: 56ch; margin: 0; text-wrap: pretty; }
.ic { width: 18px; height: 18px; flex: none; }

/* buttons */
.b { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: 500 15px/1 var(--fb); letter-spacing: -.005em; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: background .3s, border-color .3s, color .3s, box-shadow .3s, transform .35s cubic-bezier(.2, .7, .2, 1); white-space: nowrap; }
.b .ic { transition: transform .3s; }
.b:hover .ic { transform: translateX(3px); }
.b-pri { background: linear-gradient(180deg, #6690ff, #3e69f2); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 12px 32px -12px rgba(79, 124, 255, .8); }
.b-pri:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 16px 40px -10px rgba(79, 124, 255, .95); }
.b-gh { border-color: var(--line-2); color: var(--fg); background: rgba(255, 255, 255, .025); }
.b-gh:hover { border-color: rgba(214, 224, 255, .32); background: rgba(255, 255, 255, .05); }
.b-wa { background: #1c9c55; color: #fff; }
.b-wa:hover { background: #20b060; }
.b-sm { min-height: 38px; padding: 0 16px; font-size: 13.5px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: rgba(7, 8, 11, .78); backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); border-bottom: 1px solid var(--line); }
.hdr-top { display: flex; align-items: center; gap: 28px; height: 64px; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
.lm { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font: 800 17px/1 var(--fd); color: #fff; background: radial-gradient(120% 120% at 0% 0%, #6f95ff 0%, #2c4fd8 45%, #121a3a 100%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18), 0 6px 18px -6px rgba(79, 124, 255, .9); position: relative; }
.lm::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
.lw { font: 700 14.5px/1 var(--fd); letter-spacing: .12em; }
.lw b { font-weight: 500; color: var(--blue-2); margin-left: .4em; letter-spacing: .14em; }
.hdr-links { display: flex; gap: 4px; }
.hdr-links a, .hdr-cats a { text-decoration: none; color: var(--mut); font-size: 14px; padding: 8px 12px; border-radius: 999px; transition: color .2s, background .2s; white-space: nowrap; }
.hdr-links a:hover, .hdr-cats a:hover { color: var(--fg); background: rgba(255, 255, 255, .045); }
.hdr-links a.on { color: var(--fg); }
.hdr-cats { display: flex; gap: 2px; align-items: center; height: 44px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.hdr-cats::-webkit-scrollbar { display: none; }
.hdr-cats a { font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.hdr-cats a i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); opacity: .75; }
.hdr-cats a.on { color: var(--fg); background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line-2); }
.hdr-cats .hc-l { font: 500 10.5px/1 var(--fm); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; padding-right: 10px; white-space: nowrap; }
.burger { display: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); cursor: pointer; position: relative; }
.burger i { position: absolute; left: 13px; right: 13px; height: 1.5px; background: var(--fg); border-radius: 2px; transition: transform .35s cubic-bezier(.2, .7, .2, 1), top .35s; }
.burger i:first-child { top: 17px; } .burger i:last-child { top: 25px; }
.menu-open .burger i:first-child { top: 21px; transform: rotate(45deg); }
.menu-open .burger i:last-child { top: 21px; transform: rotate(-45deg); }
.mnav { position: fixed; inset: 0; z-index: 55; background: rgba(7, 8, 11, .97); padding: calc(80px + env(safe-area-inset-top, 0px)) 24px calc(32px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; opacity: 0; transition: opacity .35s; }
.mnav.open { opacity: 1; }
.mnav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mnav li { opacity: 0; transform: translateY(14px); transition: opacity .45s, transform .45s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i) * 35ms); }
.mnav.open li { opacity: 1; transform: none; }
.mnav a { display: flex; align-items: center; justify-content: space-between; text-decoration: none; font: 600 clamp(24px, 6.5vw, 32px)/1.1 var(--fd); letter-spacing: -.03em; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mnav a small { font: 500 11px var(--fm); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.mnav a i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--blue)); }
.mnav .b { margin-top: 24px; width: 100%; }
@media (max-width: 960px) {
  .hdr-links, .hdr-cats, .hdr-top > .b { display: none; }
  .burger { display: block; }
  .hdr-top { height: 62px; }
}

/* page transitions */
main { display: block; }
.pt-in { animation: ptIn .5s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes ptIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------- HOME HERO ---------- */
.hx { position: relative; padding-block: clamp(36px, 5vw, 72px) clamp(40px, 6vw, 96px); overflow: hidden; isolation: isolate; }
.hx::before { content: ""; position: absolute; inset: -10% -10% 0; z-index: -2; background: radial-gradient(42% 46% at 72% 38%, rgba(79, 124, 255, .22), transparent 70%), radial-gradient(30% 30% at 96% 86%, rgba(207, 174, 114, .1), transparent 70%), radial-gradient(40% 40% at 8% 12%, rgba(79, 124, 255, .07), transparent 70%); }
.hx::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46%; z-index: -1; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; transform: perspective(600px) rotateX(62deg); transform-origin: 50% 100%; -webkit-mask-image: radial-gradient(60% 90% at 60% 100%, #000 20%, transparent 75%); mask-image: radial-gradient(60% 90% at 60% 100%, #000 20%, transparent 75%); }
.hx-pt { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.hx-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: clamp(24px, 3vw, 48px); align-items: center; }
.hx-copy { display: grid; gap: 26px; justify-items: start; }
.hx h1 .grad { background: linear-gradient(100deg, #ffffff 10%, var(--blue-2) 60%, var(--gold) 110%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hx-meta { display: flex; gap: clamp(18px, 3vw, 40px); flex-wrap: wrap; padding-top: 22px; border-top: 1px solid var(--line); width: 100%; }
.hx-meta div { display: grid; gap: 4px; }
.hx-meta b { font: 600 26px/1 var(--fd); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hx-meta span { font-size: 13px; color: var(--mut); }
.hx-stage { position: relative; height: clamp(360px, 40vw, 600px); perspective: 1800px; }
.hx-rig { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(var(--rx, 10deg)) rotateY(var(--ry, -18deg)) rotateZ(1deg); transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.scr { position: absolute; transform-style: preserve-3d; }
.scr-f { border-radius: 12px; overflow: hidden; background: #0d0f14; box-shadow: 0 50px 90px -40px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .09), 0 0 60px -20px rgba(79, 124, 255, .35); animation: bob 8s ease-in-out infinite; }
.scr.s1 { left: 6%; top: 10%; width: 74%; transform: translateZ(0); }
.scr.s2 { left: -6%; top: 56%; width: 44%; transform: translateZ(90px); }
.scr.s2 .scr-f { animation-delay: -2s; }
.scr.s3 { right: -8%; top: -4%; width: 42%; transform: translateZ(-90px); }
.scr.s3 .scr-f { animation-delay: -4s; }
.scr.ph { right: 1%; top: 36%; width: 21%; transform: translateZ(160px); }
.scr.ph .scr-f { border-radius: 26px; border: 5px solid #1b1e26; animation-delay: -6s; }
@keyframes bob { 50% { transform: translateY(-10px); } }
.chr { height: 24px; display: flex; align-items: center; gap: 5px; padding: 0 10px; background: #14171e; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.chr i { width: 6px; height: 6px; border-radius: 50%; background: #343946; }
.chr span { margin-left: 10px; flex: 1; max-width: 60%; height: 13px; border-radius: 7px; background: #1d212b; font: 500 7.5px/13px var(--fm); color: #6b7386; padding-left: 8px; overflow: hidden; white-space: nowrap; }
.hx-floor { position: absolute; left: 10%; right: 4%; bottom: -4%; height: 60px; background: radial-gradient(50% 50% at 50% 50%, rgba(79, 124, 255, .35), transparent 70%); filter: blur(20px); transform: translateZ(-120px) rotateX(80deg); }
@media (max-width: 960px) {
  .hx-in { grid-template-columns: 1fr; }
  .hx-stage { height: clamp(300px, 72vw, 460px); margin-top: 12px; }
  .scr.s3 { display: none; }
  .scr.s1 { left: 2%; width: 84%; top: 4%; }
  .scr.s2 { left: -2%; top: 58%; width: 52%; }
  .scr.ph { right: 0; width: 26%; top: 34%; }
}

/* scaler (live miniature concept) */
.sc { position: relative; overflow: hidden; background: #fff; }
.sc-in { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; will-change: transform; }
.scr .sc { aspect-ratio: 16/10; } .scr .sc.phs { aspect-ratio: 9/19; } .lp-sc { aspect-ratio: 16/10; }
.sc-hint { position: absolute; right: 12px; bottom: 12px; z-index: 2; font: 500 11px/1 var(--fm); letter-spacing: .08em; color: #fff; background: rgba(7, 8, 11, .72); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 999px; display: inline-flex; gap: 8px; align-items: center; transition: opacity .3s; pointer-events: none; }
.sc:hover .sc-hint { opacity: 0; }

/* section scaffolding */
.sec-s { padding-block: clamp(64px, 9vw, 140px); position: relative; }
.sh { display: flex; justify-content: space-between; align-items: end; gap: 24px 48px; flex-wrap: wrap; margin-bottom: clamp(32px, 4vw, 56px); }
.sh > div { display: grid; gap: 18px; max-width: 760px; }

/* industry cards */
.ind { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.icard { --c: var(--blue); position: relative; display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(180deg, rgba(255, 255, 255, .028), rgba(255, 255, 255, .008)); overflow: hidden; text-decoration: none; transition: border-color .4s, transform .5s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; isolation: isolate; }
.icard::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(60% 50% at 80% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); opacity: .45; transition: opacity .5s; }
.icard:hover { border-color: color-mix(in srgb, var(--c) 40%, transparent); }
.icard:hover::before { opacity: 1; }
.ic-mock { position: relative; aspect-ratio: 16/9.4; perspective: 1400px; margin: 22px 22px 0; }
.ic-f { position: absolute; inset: 0 8% 0 0; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .08); transition: transform .7s cubic-bezier(.2, .7, .2, 1); background: #0d0f14; }
.ic-f .sc { height: calc(100% - 24px); }
.ic-f.f2 { transform: translate(6%, -5%) scale(.9); opacity: .55; filter: brightness(.6); }
.ic-f.f3 { transform: translate(11%, -10%) scale(.8); opacity: .3; filter: brightness(.45); }
.icard:hover .ic-f.f1 { transform: translate(-1%, 2%) rotateY(4deg); }
.icard:hover .ic-f.f2 { transform: translate(10%, -7%) scale(.9) rotateY(-6deg); opacity: .8; filter: brightness(.75); }
.icard:hover .ic-f.f3 { transform: translate(18%, -14%) scale(.8) rotateY(-10deg); opacity: .55; filter: brightness(.6); }
.ic-b { padding: 22px 26px 26px; display: grid; gap: 12px; align-content: start; }
.ic-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ic-b h3 { font: 650 clamp(26px, 2.4vw, 34px)/1 var(--fd); letter-spacing: -.035em; margin: 0; }
.ic-n { font: 500 11px/1 var(--fm); letter-spacing: .12em; color: var(--mut); text-transform: uppercase; white-space: nowrap; }
.ic-b p { margin: 0; color: var(--mut); font-size: 15px; max-width: 52ch; }
.ic-go { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; color: var(--fg); margin-top: 6px; }
.ic-go .ic { color: var(--c); transition: transform .3s; }
.icard:hover .ic-go .ic { transform: translateX(4px); }
.icard.custom { background: linear-gradient(140deg, rgba(79, 124, 255, .12), rgba(207, 174, 114, .06) 70%, transparent); }
.cust-art { margin: 22px 22px 0; aspect-ratio: 16/9.4; border-radius: 12px; border: 1px dashed var(--line-2); display: grid; place-items: center; position: relative; overflow: hidden; }
.cust-art span { font: 700 clamp(48px, 7vw, 96px)/1 var(--fd); letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1px rgba(214, 224, 255, .28); }
.cust-art em { position: absolute; font: 500 11px var(--fm); letter-spacing: .14em; text-transform: uppercase; color: var(--mut); font-style: normal; }
.cust-art em:nth-of-type(1) { top: 16%; left: 10%; } .cust-art em:nth-of-type(2) { top: 26%; right: 10%; } .cust-art em:nth-of-type(3) { bottom: 18%; left: 16%; } .cust-art em:nth-of-type(4) { bottom: 12%; right: 14%; }
@media (max-width: 820px) { .ind { grid-template-columns: 1fr; } }

/* flow steps */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; counter-reset: f; }
.flow li { position: relative; padding: 26px 24px 28px; border: 1px solid var(--line); border-radius: 20px; background: var(--ink-2); display: grid; gap: 10px; align-content: start; }
.flow li b { font: 500 12px var(--fm); letter-spacing: .1em; color: var(--blue-2); }
.flow li h3 { font: 600 21px/1.15 var(--fd); letter-spacing: -.02em; margin: 0; }
.flow li p { margin: 0; color: var(--mut); font-size: 14.5px; }
.flow li:not(:last-child)::after { content: ""; position: absolute; top: 34px; right: -17px; width: 18px; height: 1px; background: var(--line-2); }
@media (max-width: 900px) { .flow { grid-template-columns: 1fr 1fr; } .flow li::after { display: none; } }
@media (max-width: 520px) { .flow { grid-template-columns: 1fr; } }

/* live preview switcher */
.lp { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 2.1fr); gap: 28px; align-items: start; }
.lp-tabs { display: grid; gap: 8px; }
.lp-tabs button { text-align: left; background: transparent; border: 1px solid var(--line); color: var(--mut); padding: 16px 18px; border-radius: 16px; cursor: pointer; display: grid; gap: 4px; transition: .3s; }
.lp-tabs button b { font: 600 18px/1.1 var(--fd); color: var(--fg); letter-spacing: -.02em; }
.lp-tabs button span { font: 500 11px var(--fm); letter-spacing: .12em; text-transform: uppercase; }
.lp-tabs button.on { border-color: rgba(79, 124, 255, .55); background: rgba(79, 124, 255, .08); color: var(--blue-2); }
.lp-tabs .b { margin-top: 10px; }
.bw { border-radius: 14px; overflow: hidden; background: #0d0f14; box-shadow: 0 60px 120px -50px rgba(0, 0, 0, .95), 0 0 0 1px rgba(255, 255, 255, .09); }
.bw .chr { height: 34px; padding: 0 14px; gap: 7px; }
.bw .chr i { width: 9px; height: 9px; }
.bw .chr span { height: 18px; font-size: 10.5px; line-height: 18px; border-radius: 9px; max-width: 46%; }
.lp-v[hidden] { display: none; }
@media (max-width: 900px) { .lp { grid-template-columns: 1fr; } .lp-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lp-tabs .b { grid-column: 1 / -1; } }

/* services */
.svc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.svc div { background: var(--ink); padding: 26px 22px 28px; display: grid; gap: 12px; align-content: start; transition: background .3s; min-width: 0; }
.svc div:hover { background: var(--ink-2); }
.svc .ic { width: 22px; height: 22px; color: var(--blue-2); }
.svc h3 { margin: 0; font: 600 17px/1.2 var(--fd); letter-spacing: -.015em; }
.svc p { margin: 0; color: var(--mut); font-size: 13.5px; }
@media (max-width: 1100px) { .svc { grid-template-columns: repeat(3, minmax(0, 1fr)); } .svc div:nth-child(10) { grid-column: span 2; } }
@media (max-width: 640px) { .svc { grid-template-columns: 1fr 1fr; } .svc div:nth-child(10) { grid-column: auto; } }
@media (max-width: 400px) { .svc { grid-template-columns: 1fr; } }
.incl { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.incl span { display: inline-flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--fg); background: rgba(255, 255, 255, .02); }
.incl .ic { color: var(--gold); width: 16px; height: 16px; }

/* about block */
.ab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 96px); align-items: center; }
.mono3d { position: relative; aspect-ratio: 1; max-width: 520px; width: 100%; perspective: 1000px; display: grid; place-items: center; }
.mono3d .m-rig { position: relative; transform-style: preserve-3d; transform: rotateX(14deg) rotateY(-24deg); animation: spinSlow 18s ease-in-out infinite alternate; }

    return [`${LG(id + 's', mix(p[0], p[3], .1), mix(p[0], p[3], .45))}`, `<rect width="400" height="300" fill="url(#${id}s)"/><circle cx="${f(100 + R() * 200)}" cy="110" r="36" fill="${p[3]}" opacity=".7"/>${a}${b}`];
  };
  K.map = (p, R, id) => {
    let roads = '', blocks = '';
    for (let i = 0; i < 18; i++) blocks += `<rect x="${f(R() * 380)}" y="${f(R() * 280)}" width="${f(20 + R() * 50)}" height="${f(14 + R() * 36)}" rx="2" fill="${p[2]}" opacity=".5"/>`;
    for (let i = 0; i < 6; i++) roads += `<path d="M${f(R() * 400)},-10 L${f(R() * 400)},310" stroke="${p[4]}" stroke-width="${i % 3 ? 3 : 7}" opacity=".55"/>`;
    for (let i = 0; i < 5; i++) roads += `<path d="M-10,${f(R() * 300)} L410,${f(R() * 300)}" stroke="${p[4]}" stroke-width="${i % 2 ? 3 : 6}" opacity=".55"/>`;
    return [``, `<rect width="400" height="300" fill="${p[1]}"/>${blocks}<path d="M-10,${f(200 + R() * 40)} C120,${f(170 + R() * 30)} 220,${f(250)} 410,${f(190 + R() * 30)}" stroke="${p[3]}" stroke-width="18" fill="none" opacity=".35"/>${roads}<ellipse cx="300" cy="80" rx="60" ry="34" fill="${mix(p[1], '#3f6b3a', .4)}" opacity=".5"/>`];
  };
  K.bowl = (p, R, id) => [`${RG(id + 'g', p[3], .5)}`,
    `<rect width="400" height="300" fill="${p[0]}"/><circle cx="200" cy="170" r="160" fill="url(#${id}g)"/>
    ${[0, 1, 2].map(i => `<path d="M${170 + i * 30},110 c-10,-16 10,-26 0,-44" stroke="${p[4]}" stroke-width="3" fill="none" opacity=".4" stroke-linecap="round"/>`).join('')}
    <ellipse cx="200" cy="150" rx="120" ry="20" fill="${p[2]}"/><path d="M80,150 C84,220 140,252 200,252 C260,252 316,220 320,150Z" fill="${p[4]}"/>
    <path d="M86,170 C110,180 290,180 314,170" stroke="${p[3]}" stroke-width="4" fill="none"/><ellipse cx="200" cy="262" rx="70" ry="8" fill="#000" opacity=".2"/>
    ${[0, 1, 2, 3, 4].map(i => `<circle cx="${130 + i * 34}" cy="${146 + (i % 2) * 6}" r="${8 + (i % 3) * 3}" fill="${i % 2 ? p[3] : mix(p[1], p[3], .4)}"/>`).join('')}`];
  K.pastry = (p, R, id) => [`${LG(id + 'c', mix(p[3], '#f1c27d', .5), mix(p[2], '#a0582a', .4), 1, 1)}`,
    `<rect width="400" height="300" fill="${p[0]}"/><ellipse cx="200" cy="176" rx="150" ry="70" fill="${p[4]}"/><ellipse cx="200" cy="170" rx="150" ry="70" fill="${mix(p[4], '#ffffff', .3)}"/>
    ${[-2, -1, 0, 1, 2].map(i => `<ellipse cx="${200 + i * 30}" cy="${160 - Math.abs(i) * 6}" rx="${28 - Math.abs(i) * 5}" ry="${34 - Math.abs(i) * 8}" fill="url(#${id}c)" transform="rotate(${i * 18} ${200 + i * 30} ${160 - Math.abs(i) * 6})"/>`).join('')}
    ${Array.from({ length: 14 }, () => `<circle cx="${f(80 + R() * 240)}" cy="${f(150 + R() * 50)}" r="1.6" fill="${p[4]}" opacity=".8"/>`).join('')}`];

  function draw(kind, pal, seed = 1, cls = '') {
    const id = 'a' + (U++);
    const R = rnd(seed * 97 + kind.length);
    const fn = K[kind] || K.abstract;
    const [defs, body] = fn(pal, R, id, seed);
    return `<svg class="art ${cls}" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>${defs}</defs>${body}</svg>`;
  }
  return { draw, mix };
})();

const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n] || ICONS.spark}"/></svg>`;

const S = {};
let CX = null; // current concept while rendering
const pal = (k) => (k === 2 && CX.art2) ? CX.art2 : CX.art;
const art = (kind, seed = 1, p = 1) => ART.draw(kind, pal(p), seed);
const ph = (kind, seed = 1, cls = '', ratio = '', p = 1) => `<div class="ph ${cls}"${ratio ? ` style="aspect-ratio:${ratio}"` : ''}>${art(kind, seed, p)}</div>`;
const hd = (d, center) => (d.eb || d.t || d.p) ? `<div class="hd${center || d.c ? ' c' : ''}">${d.eb ? `<span class="eb">${d.eb}</span>` : ''}${d.t ? `<h2>${d.t}</h2>` : ''}${d.p ? `<p>${d.p}</p>` : ''}</div>` : '';
const btn = (b, i = 0) => { const [label, go] = Array.isArray(b) ? b : [b, '']; return `<button type="button" class="btn ${i ? 'o' : 's'}"${go ? ` data-goto="${go}"` : ''}>${label}${i ? '' : ic('arrow')}</button>`; };
const btns = (a) => a && a.length ? `<div class="row">${a.map(btn).join('')}</div>` : '';
const stars = (n = 5) => `<span class="stars" aria-label="${n} out of 5 stars">${ic('star').repeat(n)}</span>`;
const PK = (n) => 'PKR ' + Math.round(n).toLocaleString('en-PK');

/* NAV */
S.nav = (d) => {

  return `<header class="cn cn-${d.v || 'left'}"><div class="w cn-in">

};

    if (v === 'lux') return `<article class="li li-x" data-cat="${it.c || ''}"><div class="li-ph">${ph(it.a, it.s || i + 1, '', '4/5', it.p2 ? 2 : 1)}${it.tag ? `<span class="tag">${it.tag}</span>` : ''}</div><div class="li-b"><span class="li-loc">${ic('pin')}${it.l}</span><h3>${it.t}</h3>${meta}<span class="li-pr">${it.pt}</span></div></article>`;

/* ---------- RENDER A CONCEPT ---------- */
function themeVars(c) {
  const t = c.t;
  return `--bg:${t.bg};--fg:${t.fg};--mut:${t.mut};--acc:${t.acc};--onacc:${t.onacc};--sur:${t.sur};--line:${t.line};--fd:${t.fd};--fb:${t.fb};--hw:${t.hw || 600};--ht:${t.ht || 'none'};--hls:${t.hls || '-0.02em'};--hlh:${t.hlh || 1.02};--r:${t.r || '6px'};--rs:${t.rs || (/\s/.test(t.r || '') ? '12px' : `min(${t.r || '6px'}, 14px)`)};--br:${t.br || '999px'};--hs:${t.hs || 1}`;
}
function renderConcept(c, opts = {}) {
  CX = c;
  const k = (opts.pre || 'f') + c.id.replace(/[^a-z0-9]/g, '');
  const list = opts.limit ? c.s.slice(0, opts.limit) : c.s;
  const html = list.map(([type, d], i) => (S[type] ? S[type](d, k + i) : '')).join('');
  return `<div class="cx ${c.t.cls || ''}" data-cx="${c.id}" style="${themeVars(c)}">${html}</div>`;
}
function renderLayer(c) {

    const line = (it, i, big) => `<div class="ck-ln"><div class="ph">${ART.draw(it.a, c.art, it.s)}</div><div><b>${it.n}</b><small>${PK(it.p)}</small>${big ? '' : `<div class="qty"><button type="button" data-q="-" data-i="${i}" aria-label="Decrease">${ic('minus')}</button><span>${it.q}</span><button type="button" data-q="+" data-i="${i}" aria-label="Increase">${ic('plus')}</button></div>`}</div>${big ? `<div class="qty"><button type="button" data-q="-" data-i="${i}" aria-label="Decrease">${ic('minus')}</button><span>${it.q}</span><button type="button" data-q="+" data-i="${i}" aria-label="Increase">${ic('plus')}</button></div>` : ''}<b>${PK(it.p * it.q)}</b></div>`;
    $$('[data-cart-count]', X || document).forEach(e => e.textContent = count);
    if (L) { const dl = $('[data-cart-lines]', L); if (dl) dl.innerHTML = cart.length ? cart.map((it, i) => line(it, i)).join('') : `<p class="ck-empty">Your bag is empty. Add something you love.</p>`; const tt = $('[data-cart-total]', L); if (tt) tt.textContent = PK(sub); }
    if (X) {
      const cl = $('[data-ck-lines]', X); if (cl) cl.innerHTML = cart.length ? cart.map((it, i) => line(it, i, 1)).join('') : `<p class="ck-empty">Your bag is empty. Use “Add to bag” on any product above to try the checkout.</p>`;
      const sm = $('[data-ck-sum]', X); const ship = sub > 15000 || !sub ? 0 : 450;
      if (sm) sm.innerHTML = `<div class="sum-r"><span>Items</span><b>${count}</b></div><div class="sum-r"><span>Subtotal</span><b>${PK(sub)}</b></div><div class="sum-r"><span>Delivery</span><b>${ship ? PK(ship) : 'Free'}</b></div><div class="sum-r t"><span>Total</span><b>${PK(sub + ship)}</b></div>`;
    }
  }
  function drawer(id, open) { const L = layerOf(id); if (!L) return; $('[data-drawer]', L).hidden = !open; $('.dr-sc', L).hidden = !open; }

  /* ----- calculators ----- */
  function calcAll() { $$('[data-calc]').forEach(calc); }
  function calc(el) {
    const g = (k) => +$(`[data-c="${k}"]`, el).value;
    const price = g('price') * 1e5, down = g('down'), yrs = g('yrs'), r = 13 / 100 / 12, n = yrs * 12, P = price * (1 - down / 100);
    const emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
    const fmtCr = (v) => v >= 1e7 ? `PKR ${(v / 1e7).toFixed(2).replace(/\.?0+$/, '')} Cr` : `PKR ${(v / 1e5).toFixed(0)} Lac`;
    $('[data-o="price"]', el).textContent = fmtCr(price); $('[data-o="down"]', el).textContent = down + '%'; $('[data-o="yrs"]', el).textContent = yrs + ' years'; $('[data-o="emi"]', el).textContent = PK(emi);
  }

  /* ----- global events ----- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a, [data-goto], [data-wa-demo]');
    if (!t) return;
    if (t.classList.contains('burger')) { menu(!document.body.classList.contains('menu-open')); return; }
    if (t.matches('[data-scrollto]')) { const el = document.getElementById(t.dataset.scrollto); if (el) { e.preventDefault(); el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); } return; }
    if (t.matches('[data-build]')) { pending = t.dataset.build; if (location.hash === '#contact') { curRoute = null; route(); } return; }
    if (t.matches('[data-home-ind]')) { e.preventDefault(); location.hash = 'industries'; return; }
    if (t.matches('[data-copy]')) { const v = t.dataset.copy; const done = () => { t.textContent = 'Copied'; setTimeout(() => t.textContent = 'Copy', 1600); }; try { navigator.clipboard.writeText(v).then(done, () => { selectText(t.previousElementSibling); }); } catch (_) { selectText(t.previousElementSibling); } return; }
    if (t.matches('[data-lp]')) { const i = t.dataset.lp; $$('[data-lp]').forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-selected', b === t); }); $$('[data-lpv]').forEach(v => v.hidden = v.dataset.lpv !== i); const id = ['restaurants-2', 'real-estate-1', 'clinics-1', 'gyms-1', 'ecommerce-1'][i]; $('[data-lp-open]').href = '#' + id; fit($(`[data-lpv="${i}"]`)); return; }
    if (t.matches('[data-dev]')) { $$('[data-dev]').forEach(b => b.classList.toggle('on', b === t)); const st = $('.cstage'); st.classList.remove('m-tab', 'm-mob'); if (t.dataset.dev) st.classList.add(t.dataset.dev); return; }
    /* concept interactions */
    const cx = cxOf(t); if (!cx) return;
    const id = cx.dataset.cx;
    if (t.matches('[data-goto]')) {
      const g = t.dataset.goto; if (t.matches('[data-cart-close]')) drawer(id, false);
      const tgt = g && $(`[data-sec="${g}"]`, cx); if (tgt && !t.closest('.sc')) tgt.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
      if (t.tagName === 'A') e.preventDefault(); return;
    }
    if (t.matches('[data-filter]')) { const sec = t.closest('section'), f = t.dataset.filter; $$('[data-filter]', sec).forEach(b => b.classList.toggle('on', b === t)); $$('.li', sec).forEach(li => li.hidden = !(f === '*' || li.dataset.cat === f)); return; }
    if (t.matches('[data-seg]')) { $$('[data-seg]', t.parentElement).forEach(b => b.classList.toggle('on', b === t)); return; }
    if (t.matches('[data-tab]')) { const sec = t.closest('section'), i = t.dataset.tab; $$('[data-tab]', sec).forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-selected', b === t); }); $$('[data-pane]', sec).forEach(p => p.hidden = p.dataset.pane !== i); return; }
    if (t.matches('[data-thumb]')) { const sec = t.closest('section'), i = t.dataset.thumb; $$('[data-thumb]', sec).forEach(b => b.classList.toggle('on', b === t)); $$('[data-slide]', sec).forEach(s => s.classList.toggle('on', s.dataset.slide === i)); return; }
    if (t.matches('[data-car-prev],[data-car-next]')) { const car = t.closest('[data-car]'), sl = $$('.car-s', car), dots = $$('.car-d i', car); let i = sl.findIndex(s => s.classList.contains('on')); i = (i + (t.matches('[data-car-next]') ? 1 : -1) + sl.length) % sl.length; sl.forEach((s, k) => s.classList.toggle('on', k === i)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); return; }
    if (t.matches('[data-bill]')) { const sec = t.closest('section'); $$('[data-bill]', sec).forEach(b => b.classList.toggle('on', b === t)); $$('[data-m]', sec).forEach(s => s.textContent = s.dataset[t.dataset.bill]); return; }
    if (t.matches('[data-spot]')) { t.classList.toggle('on'); t.textContent = t.classList.contains('on') ? 'Booked' : 'Book'; return; }
    if (t.matches('[data-fav]')) { t.classList.toggle('on'); return; }
    if (t.matches('[data-avail]')) { const bar = t.closest('.hx-bar'), ins = $$('input[type=date]', bar), out = $('[data-avail-out]', bar); const n = Math.max(1, Math.round((new Date(ins[1].value) - new Date(ins[0].value)) / 864e5)) || 3; out.hidden = false; out.innerHTML = `${ic('check')} Good news: ${n === 1 ? '1 night' : n + ' nights'} available in 4 room types. Scroll down to choose.`; return; }
    if (t.matches('[data-wa-demo]')) { toast(id, 'Concept demo: on your site this opens a WhatsApp chat with you.'); return; }
    if (t.matches('[data-add]')) { const it = JSON.parse(decodeURIComponent(t.dataset.add)); const cart = carts[id] || (carts[id] = []); const ex = cart.find(x => x.n === it.n); ex ? ex.q++ : cart.push({ ...it, q: 1 }); renderCart(id); drawer(id, true); return; }
    if (t.matches('[data-cart-open]')) { renderCart(id); drawer(id, true); return; }
    if (t.matches('[data-cart-close]')) { drawer(id, false); return; }
    if (t.matches('[data-q]')) { const cart = carts[id] || []; const it = cart[+t.dataset.i]; if (!it) return; it.q += t.dataset.q === '+' ? 1 : -1; if (it.q < 1) cart.splice(+t.dataset.i, 1); renderCart(id); return; }
    if (t.matches('[data-next],[data-prev],[data-restart]')) {
      const ck = t.closest('[data-ck]'), steps = $$('[data-step]', ck); let i = steps.findIndex(s => !s.hidden);
      if (t.matches('[data-next]') && i === 0 && !(carts[id] || []).length) { toast(id, 'Add a product to your bag first.'); return; }
      i = t.matches('[data-restart]') ? 0 : i + (t.matches('[data-next]') ? 1 : -1);
      if (t.matches('[data-restart]') || i === 3) { if (i === 3) { carts[id] = []; } }
      steps.forEach((s, k) => s.hidden = k !== i); $$('[data-step-i]', ck).forEach((li, k) => { li.classList.toggle('on', k === i); li.classList.toggle('done', k < i); });
      renderCart(id); return;
    }
  });
  function selectText(el) { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('[data-ba]')) t.parentElement.style.setProperty('--p', t.value + '%');
    else if (t.matches('[data-rg]')) { const o = JSON.parse(t.dataset.rg); $('[data-rg-out]', t.closest('.se-rg')).textContent = o[+t.value]; }
    else if (t.closest('[data-calc]')) calc(t.closest('[data-calc]'));
    if (t.closest('#cform')) updateWA();
  });
  document.addEventListener('change', (e) => { if (e.target.closest('#cform')) updateWA(); });
  document.addEventListener('submit', (e) => {
    const f = e.target; e.preventDefault();
    if (f.matches('[data-book]')) { const ok = $('.bk-ok', f), b = $('.bk-sub', f); ok.hidden = false; b.disabled = true; b.style.opacity = .55; b.firstChild.textContent = 'Sent '; }
    if (f.matches('[data-news]')) { $('.nw-ok', f).hidden = false; }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { menu(false); $$('[data-drawer]').forEach(d => { if (!d.hidden) drawer(d.closest('[data-layer]').dataset.layer, false); }); } });

  /* magnetic buttons + tilt (fine pointers only) */
  if (mqFine.matches && !lite) {
    document.addEventListener('pointermove', (e) => {
      const m = e.target.closest && e.target.closest('.mag');
      $$('.mag.magged').forEach(x => { if (x !== m) { x.style.transform = ''; x.classList.remove('magged'); } });
      if (m) { const b = m.getBoundingClientRect(); m.classList.add('magged'); m.style.transform = `translate(${(e.clientX - b.left - b.width / 2) * .18}px, ${(e.clientY - b.top - b.height / 2) * .28}px)`; }
      const tl = e.target.closest && e.target.closest('.tilt');
      $$('.tilt.tilted').forEach(x => { if (x !== tl) { x.style.transform = ''; x.classList.remove('tilted'); } });
      if (tl) { const b = tl.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5; tl.classList.add('tilted'); tl.style.transform = `perspective(1200px) rotateX(${-y * 4}deg) rotateY(${x * 5}deg) translateY(-4px)`; }
    }, { passive: true });
  }

  header();
  addEventListener('hashchange', route);
  route();
})();

</script>
